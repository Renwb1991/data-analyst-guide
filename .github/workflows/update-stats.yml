name: 同步 README 统计数字

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/scripts/update_stats.py'
      - '.github/workflows/update-stats.yml'
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write           # 需要写回 README

concurrency:
  group: update-stats
  cancel-in-progress: false # 串行执行，避免并发推送打架

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 统计并更新 README
        run: python3 .github/scripts/update_stats.py

      - name: 有变化才提交
        run: |
          if git diff --quiet -- README.md; then
            echo "README 统计数字已是最新，无需提交"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # 用 GITHUB_TOKEN 推送的提交不会再次触发 workflow（GitHub 内置的防循环机制）；
          # [skip ci] 是第二道保险。
          git commit -m "chore: 同步 README 统计数字 [skip ci]"
          git push

          echo "### README 统计数字已更新" >> "$GITHUB_STEP_SUMMARY"
          git show --stat --format='' HEAD >> "$GITHUB_STEP_SUMMARY"
